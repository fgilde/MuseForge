name: MuseForge
version: "3.2.0"
tagline: Self-hosted AI studio for video, images, audio and audiobooks
description: >-
  MuseForge generates video, images, audio, long-form text and complete
  audiobooks on your own hardware. Nothing is sent to a cloud service.


  Beyond single generations it includes a Director mode that plans a whole
  music video or short film from one sentence, a Storywriter for
  novel-length prose with translation and a continuity audit, and an
  audiobook producer that turns a document into spoken chapters with a
  voice per character.


  Everything the web interface can do is also a REST API, and a built-in
  MCP endpoint lets AI agents drive it directly — hand an agent a document
  and get back a finished audiobook.


  ⚠️ Hardware requirements, please read before installing:


  - An NVIDIA GPU with at least 6 GB of VRAM, with the NVIDIA Container
    Toolkit installed on the host. There is no AMD, Apple Silicon or
    CPU-only mode — this will not run on a Raspberry Pi.

  - Roughly 150 GB of free disk space for model weights.

  - Model weights are not part of the image. The first use of any model
    downloads its files once, often tens of gigabytes for a video model,
    before anything appears. Later runs start immediately.
releaseNotes: >-
  Level with Maestro 3.2.0. New experimental FastH3 models: V2 8-step text
  to video with generated audio, and OmniRef 8-step for image, video and
  audio references. Qwen Image 2.1 downloads and VAE decoding are fixed,
  the app starts faster, and Director keeps visual styles and choreography.


  Since 3.1.0: MOSS Image 5B, native FLUX 3 Klein with LoRA import, lower
  memory H3 with native 1080p on 12 GB, live previews, a full-screen gallery
  viewer and cancellable model downloads.


