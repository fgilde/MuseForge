name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "docs/logo.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The images live in docs/ so the README can use them too. Copying them
      # in at build time keeps one copy in git instead of two that drift.
      - name: Collect assets
        run: |
          cp docs/logo.png site/logo.png
          mkdir -p site/screenshots
          cp docs/screenshots/*.png site/screenshots/

      - name: Check internal links
        run: python scripts/check_site_links.py site

      # Pages would otherwise run the content through Jekyll, which ignores
      # directories starting with an underscore and rewrites nothing we want.
      - name: Disable Jekyll
        run: touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
