name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Clean-repo guard
        run: python scripts/verify_clean_repo.py

      - name: Python syntax check
        # compileall only compiles (never imports), so it needs no deps and
        # skips heavy vendored model code. Covers the surface we edit.
        run: python -m compileall -q app/services app/launch.py scripts

      - name: Undefined Python names (our modules)
        # Syntax compilation cannot detect a missing import or a value read
        # before assignment on an infrequently exercised request path.
        run: |
          python -m pip install "ruff==0.16.2"
          python -m ruff check --select F821,F823 app/services app/models/minimax_h3 app/launch.py

      # Store templates are the files nobody revisits, and the only thing
      # between a user and a broken install.
      - name: App store templates
        run: python scripts/check_packaging.py

      - name: Install lightweight test dependencies
        run: >-
          python -m pip install
          "starlette==0.46.1"
          "fastapi==0.141.1"
          "gradio==5.29.0"
          "pydantic==2.10.6"
          "python-multipart==0.0.32"
          "httpx==0.28.1"
          "soundfile==0.13.1"
          "numpy==2.2.6"
          "opencv-python-headless==4.12.0.88"
          "Pillow==11.3.0"
          "requests==2.32.4"
          "cryptography==49.0.0"
          "ffmpeg-python==0.2.0"
          "imageio==2.37.2"
          "av==16.1.0"
          "decord==0.6.0"
          "iopath==0.1.10"
          "onnxruntime==1.22.0"
          "pycocotools==2.0.11"
          "rembg==2.0.65"
          "scipy==1.15.3"
          "librosa==0.11.0"
          "timm==1.0.24"
          "ftfy==6.3.1"
      - name: Install CPU PyTorch test dependency
        run: >-
          python -m pip install
          "torch==2.7.1"
          "torchvision==0.22.1"
          "torchaudio==2.7.1"
          --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned core model test dependencies
        run: >-
          python -m pip install
          "mmgp==3.7.12"
          "diffusers==0.36.0"
          "transformers==4.57.1"
          "tokenizers==0.22.1"
          "accelerate==1.12.0"
          "einops==0.8.2"
          "safetensors==0.8.0"
          "triton==3.3.1"
      - name: Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: JSON grammar regression tests
        # Standalone test functions, not picked up by unittest discovery.
        run: python tests/test_call_llm_json_grammar.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI type-check + build
        working-directory: ui
        run: |
          npm ci
          npm run build
